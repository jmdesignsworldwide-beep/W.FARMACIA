<!doctype html>
<html lang="es-DO">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión · Wilkins Farmacia</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b0e14; color: #e6e9ef;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; padding: 24px;
    }
    .box { max-width: 380px; }
    .dot {
      width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 20px;
      background: linear-gradient(135deg, #10986a, #12b3a6);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #9aa3b2; line-height: 1.5; margin: 0 0 20px; font-size: 14px; }
    button {
      background: linear-gradient(135deg, #10986a, #12b3a6); color: white; border: 0;
      padding: 12px 22px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    small { display: block; margin-top: 18px; color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="dot">📶</div>
    <h1>Sin conexión</h1>
    <p>Se cayó el internet. La app queda instalada y vuelve sola cuando regrese la señal. Las páginas que ya abriste siguen disponibles; cobrar espera a que vuelva la conexión.</p>
    <button onclick="location.reload()">Reintentar</button>
    <small>Wilkins Farmacia — hecho por JM Nexus Designs</small>
  </div>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
